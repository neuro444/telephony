services:
  gateway:
    build: .
    container_name: plivo-gateway
    ports:
      - "127.0.0.1:${TELEPHONY_PORT:-8080}:8080"
      # Bound to localhost only. Public exposure happens via nginx on the
      # VPS (Phase 5) — never publish this port directly.
    env_file:
      - .env
    environment:
      # Keep mutable data outside /app. Mounting a named volume on /app/orders
      # or /app/cost hides the Python package copied into the image and leaves
      # rebuilt containers running stale code from the persistent volume.
      AUDIO_DIR: /data/audio
      ORDERS_LOG_PATH: /data/orders/orders.jsonl
      COST_LOG_PATH: /data/cost/costs.jsonl
    volumes:
      - gateway_audio:/data/audio
      - gateway_orders:/data/orders
      - gateway_cost:/data/cost
    restart: unless-stopped
    networks:
      - default
      - chat_manager_default
      # chat_manager_default must already exist (created when chat_manager's
      # own `docker compose up` runs first). This lets the gateway reach
      # chat-manager-api by container name without publishing its port.

volumes:
  gateway_audio:
  gateway_orders:
  gateway_cost:

networks:
  chat_manager_default:
    external: true
